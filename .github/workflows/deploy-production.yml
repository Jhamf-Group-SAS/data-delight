name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/jhamf-group-sas/data-delight-backend
  FRONTEND_IMAGE: ghcr.io/jhamf-group-sas/data-delight-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        run: echo "TAG=prod-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:prod-latest
            ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://registros.regency.jhamf.com' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:prod-latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Update image tags in docker-stack.yml
        run: |
          sed -i -E "s|^(    image: ${BACKEND_IMAGE}:).*|\1${TAG}|" docker-stack.yml
          sed -i -E "s|^(    image: ${FRONTEND_IMAGE}:).*|\1${TAG}|" docker-stack.yml
          grep -n "    image:" docker-stack.yml

      - name: Commit and push docker-stack.yml
        run: |
          if git diff --quiet docker-stack.yml; then
            echo "docker-stack.yml already at ${TAG}, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-stack.yml
          git commit -m "chore(deploy): actualizar imagen a ${TAG} [skip ci]"
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), retrying..."
          done
          echo "::error::Could not push docker-stack.yml to main"
          exit 1

      - name: Trigger Portainer webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL_PROD }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::error::Secret PORTAINER_WEBHOOK_URL_PROD is empty or missing"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -X POST "$PORTAINER_WEBHOOK_URL"
